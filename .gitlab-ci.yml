stages: [verify, build]
variables:
  ENVIRONMENT: test
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  UV_PYTHON_INSTALL_MIRROR: https://gh-proxy.org/https://github.com/astral-sh/python-build-standalone/releases/download
  POSTGRES_DB: rallymark_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: test-only-password
  DATABASE_URL: postgresql+psycopg://postgres:test-only-password@postgres:5432/rallymark_test
  TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@postgres:5432/rallymark_test
  INTERNAL_TOKEN: ci-only-internal-token-not-for-deployment
  CONFIG_PATH: $CI_PROJECT_DIR/deploy/config.dev.yaml
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'web'
python:
  stage: verify
  image: python:3.12-slim
  services: [postgres:17-alpine]
  before_script:
    - pip install uv==0.13.7
    - apt-get update && apt-get install -y --no-install-recommends ffmpeg
  script:
    - cd services/api && uv sync --frozen && uv run ruff check . && uv run ruff format --check . && uv run pytest -q
    - cd ../algorithm && uv sync --frozen && uv run ruff check . && uv run ruff format --check . && uv run pytest -q
  cache:
    key: python-locks
    paths: [.cache/uv/]
web:
  stage: verify
  image: node:24-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-pip
    - pip3 install --break-system-packages uv==0.13.7
    - corepack enable
  script:
    - cd apps/web
    - pnpm install --frozen-lockfile
    - pnpm check && pnpm test && pnpm build
    - pnpm exec playwright install --with-deps chromium
    - pnpm test:e2e
    - cd ../.. && uv sync --project services/api --frozen && python3 scripts/contracts.py --check
images:
  stage: build
  image: docker:27-cli
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: $DOCKER_TLS_CERTDIR/client
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - test -n "$CI_REGISTRY" || (echo "GitLab container registry must be enabled before publishing images" >&2; exit 1)
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -f deploy/Dockerfile.web -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA" .
    - docker build -f deploy/Dockerfile.api -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" .
    - docker build -f deploy/Dockerfile.algorithm --target api -t "$CI_REGISTRY_IMAGE/algorithm-api:$CI_COMMIT_SHA" .
    - docker build -f deploy/Dockerfile.algorithm --target worker -t "$CI_REGISTRY_IMAGE/algorithm-worker:$CI_COMMIT_SHA" .
    - for service in web api algorithm-api algorithm-worker; do docker push "$CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA"; done
