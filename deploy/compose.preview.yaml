services:
  preview:
    image: ${REGISTRY:-rallymark}/preview:${VERSION:?Specify VERSION}
    build: {context: .., dockerfile: deploy/Dockerfile.preview}
    restart: unless-stopped
    ports: ['${BIND_ADDRESS:-0.0.0.0}:${PREVIEW_PORT:-8081}:8080']
    volumes:
      - ${PREVIEW_DATA_PATH:-../.runtime/preview-data}:/data/demos:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
