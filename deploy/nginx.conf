limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 501m;
    client_body_timeout 120s;
    location = /api/v1/admin/login {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /demos/ {
        alias /data/demos/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /demos/manifest.json {
        alias /data/demos/manifest.json;
        add_header Cache-Control no-cache;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /health/live { access_log off; return 200 'ok'; }
}
